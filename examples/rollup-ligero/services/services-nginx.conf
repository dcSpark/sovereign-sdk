#  Simple reverse proxy for rollup, worker (verifier), and indexer.
# Mounts each service under a prefix and rewrites to `/` on the upstream.

# Ligero Prover Service - Load balanced across Mac GPU machines
upstream ligero_backends {
    server 172.33.109.145:8080 weight=10;
    server 172.33.65.65:8080 weight=20;
    server 172.33.71.114:8080 weight=20;
    server 172.33.79.77:8080 weight=20;
    server 172.33.116.4:8080 weight=20;

    # Keepalive connections for better performance (reduces connection overhead)
    keepalive 32;
    keepalive_timeout 60;
}

# Worker Service Backends
upstream worker_backends {
    server 172.33.109.145:8080 weight=10;
    server 172.33.65.65:8080 weight=20;
    server 172.33.71.114:8080 weight=20;
    server 172.33.79.77:8080 weight=20;
    server 172.33.116.4:8080 weight=20;

    # Keepalive connections for better performance (reduces connection overhead)
    keepalive 32;
    keepalive_timeout 60;
}

# Local HTTP reverse proxy (private IPs, no HTTPS redirect)
server {
    listen 80;
    server_name localhost 127.0.0.1 172.33.91.192;
    client_max_body_size 50m;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Worker/verifier -> http://127.0.0.1:8080/
    location = /worker {
        return 301 /worker/;
    }
    location /worker/ {
	proxy_pass http://worker_backends/;
        # HTTP/1.1 with empty Connection header enables keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Forward client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # === TIMEOUTS ===
        proxy_connect_timeout 10s;      # Connection to backend
        proxy_read_timeout 300s;        # Wait for response (proving is slow)
        proxy_send_timeout 60s;         # Send request to backend

        # === BUFFERING (for large proof payloads) ===
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_request_buffering off;    # Stream request body directly

        # === REQUEST LIMITS ===
        client_max_body_size 50m;       # Max proof size
        client_body_timeout 30s;        # Timeout receiving client body
    }

    # Ligero Prover Service -> http://127.0.0.1:1313/
    location = /ligero {
        return 301 /ligero/;
    }
    location /ligero/ {
        proxy_pass http://ligero_backends/;
        # HTTP/1.1 with empty Connection header enables keepalive to upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Forward client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # === TIMEOUTS ===
        proxy_connect_timeout 10s;      # Connection to backend
        proxy_read_timeout 300s;        # Wait for response (proving is slow)
        proxy_send_timeout 60s;         # Send request to backend

        # === BUFFERING (for large proof payloads) ===
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 512k;
        proxy_request_buffering off;    # Stream request body directly

        # === REQUEST LIMITS ===
        client_max_body_size 50m;       # Max proof size
        client_body_timeout 30s;        # Timeout receiving client body
    }

    # Rollup RPC -> http://127.0.0.1:12346/
    location = /rollup {
        return 301 /rollup/;
    }
    location /rollup/ {
        proxy_pass http://127.0.0.1:12346/;
    }

    # Oracle -> http://127.0.0.1:8090/
    location = /oracle {
        return 301 /oracle/;
    }
    location /oracle/ {
        proxy_pass http://127.0.0.1:8090/;
    }

    # Indexer API -> http://127.0.0.1:13100/
    location = /indexer {
        return 301 /indexer/;
    }
    location /indexer/ {
        proxy_pass http://127.0.0.1:13100/;
    }

    # FVK Service -> http://127.0.0.1:8088/
    location = /fvk {
        return 301 /fvk/;
    }
    location /fvk/ {
        proxy_pass http://127.0.0.1:8088/;
    }

    # Metrics API -> http://127.0.0.1:13200/
    location = /metrics {
        return 301 /metrics/;
    }
    location /metrics/ {
        proxy_pass http://127.0.0.1:13200/;
    }

    # MCP API -> http://127.0.0.1:3000/
    location = /mcp {
        return 301 /mcp/;
    }
    location /mcp/ {
        # MCP Streamable HTTP uses long-lived SSE connections. If nginx buffers the
        # upstream response (default), clients and upstream proxies (e.g. Cloudflare)
        # can time out while waiting for the first bytes of the event stream.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
	proxy_set_header mcp-session-id $http_mcp_session_id;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
	chunked_transfer_encoding off;
        proxy_pass http://127.0.0.1:3000/;
    }

    # Authority API (mcp-external) -> http://127.0.0.1:3000/authority
    location = /authority {
        return 301 /authority/;
    }
    location /authority/ {
        proxy_pass http://127.0.0.1:3000/authority/;
    }

    # Proof Pool API -> http://127.0.0.1:11235/
    location = /proof-pool {
        return 301 /proof-pool/;
    }
    location /proof-pool/ {
        proxy_pass http://127.0.0.1:11235/;
    }
}

# Block Explorer
server {
    listen 443 ssl http2;
    server_name block-explorer.midnight.city;

    ssl_certificate     /etc/ssl/certs/cloudflare_shinkai.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare_shinkai.key;

    return 301 https://midnight-l2-explorer.shinkai.com$request_uri;
}

# Redirect all HTTP to HTTPS
server {
    if ($host = midnight-l2-testnet.shinkai.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name midnight-l2-testnet.shinkai.com layer2.midnight.city;
    client_max_body_size 50m;
    return 301 https://$host$request_uri;


}

# HTTPS reverse proxy
server {
    listen 443 ssl;
    server_name midnight-l2-testnet.shinkai.com layer2.midnight.city;
    client_max_body_size 50m;

    # Replace with your certificate paths
    ssl_certificate /etc/letsencrypt/live/midnight-l2-testnet.shinkai.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/midnight-l2-testnet.shinkai.com/privkey.pem; # managed by Certbot

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Dashboard frontend (default route)
    # Serves the built React dashboard from utils/rollup-dashboard/dist
    # Replace path with your actual deployment path
    location / {
        auth_basic "Midnight L2 Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;

        root /var/www/rollup-dashboard;
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        auth_basic "Midnight L2 Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;

        root /var/www/rollup-dashboard;
        rewrite ^ /index.html break;
    }

   location /explorer {
       rewrite ^/explorer/?(.*)$ http://midnight-l2-explorer.shinkai.com/$1 permanent;
   }

    # Rollup RPC -> http://127.0.0.1:12346/
    location = /rollup {
        return 301 /rollup/;
    }
    location /rollup/ {
	# proxy_pass http://127.0.0.1:12346/;
        proxy_pass http://172.33.111.65:12346/;
