# Simple reverse proxy for rollup, worker (verifier), and indexer.
# Mounts each service under a prefix and rewrites to `/` on the upstream.

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 50m;

    # Replace with your certificate paths
    ssl_certificate /etc/ssl/certs/cert.pem;
    ssl_certificate_key /etc/ssl/private/key.pem;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Rollup RPC -> http://127.0.0.1:12346/
    location = /rollup {
        return 301 /rollup/;
    }
    location /rollup/ {
        proxy_pass http://127.0.0.1:12346/;
    }

    # Worker/verifier -> http://127.0.0.1:8080/
    location = /worker {
        return 301 /worker/;
    }
    location /worker/ {
        proxy_pass http://127.0.0.1:8080/;
    }

    # Indexer API -> http://127.0.0.1:13100/
    location = /indexer {
        return 301 /indexer/;
    }
    location /indexer/ {
        proxy_pass http://127.0.0.1:13100/;
    }

    # MCP API -> http://127.0.0.1:3000/
    location = /mcp {
        return 301 /mcp/;
    }
    location /mcp/ {
        proxy_pass http://127.0.0.1:3000/;
    }

    # Ligero Prover Service -> http://127.0.0.1:1313/
    location = /ligero {
        return 301 /ligero/;
    }
    location /ligero/ {
        proxy_pass http://127.0.0.1:1313/;
    }

    # FVK Service -> http://127.0.0.1:8088/
    location = /fvk {
        return 301 /fvk/;
    }
    location /fvk/ {
        proxy_pass http://127.0.0.1:8088/;
    }
}
