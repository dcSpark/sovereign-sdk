# Simple reverse proxy for rollup, worker (verifier), and indexer.
# Mounts each service under a prefix and rewrites to `/` on the upstream.

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name _;
    client_max_body_size 50m;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy
server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 50m;

    # Replace with your certificate paths
    ssl_certificate /etc/ssl/certs/cert.pem;
    ssl_certificate_key /etc/ssl/private/key.pem;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CORS headers - allow all origins
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

    # Handle OPTIONS preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Dashboard frontend (default route)
    # Serves the built React dashboard from utils/rollup-dashboard/dist
    # Replace path with your actual deployment path
    # Basic auth: create password file with: htpasswd -c /etc/nginx/.htpasswd username
    location / {
        auth_basic "Midnight L2 Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;

        root /home/replace_for_linux_user/sovereign-sdk/examples/rollup-ligero/utils/rollup-dashboard/dist;
        try_files $uri $uri/ @fallback;
    }

    location @fallback {
        auth_basic "Midnight L2 Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;

        root /home/replace_for_linux_user/sovereign-sdk/examples/rollup-ligero/utils/rollup-dashboard/dist;
        rewrite ^ /index.html break;
    }

    # Rollup RPC -> http://127.0.0.1:12346/
    location = /rollup {
        return 301 /rollup/;
    }
    location /rollup/ {
        proxy_pass http://127.0.0.1:12346/;
    }

    # Worker/verifier -> http://127.0.0.1:8080/
    location = /worker {
        return 301 /worker/;
    }
    location /worker/ {
        proxy_pass http://127.0.0.1:8080/;
    }

    # Indexer API -> http://127.0.0.1:13100/
    location = /indexer {
        return 301 /indexer/;
    }
    location /indexer/ {
        proxy_pass http://127.0.0.1:13100/;
    }

    # MCP API -> http://127.0.0.1:3000/
    location = /mcp {
        return 301 /mcp/;
    }
    location /mcp/ {
        proxy_pass http://127.0.0.1:3000/;
    }

    # MCP-2 API -> http://127.0.0.1:3001/
    location = /mcp2 {
        return 301 /mcp2/;
    }
    location /mcp2/ {
        proxy_pass http://127.0.0.1:3001/;
    }

    # Ligero Prover Service -> http://127.0.0.1:1313/
    location = /ligero {
        return 301 /ligero/;
    }
    location /ligero/ {
        proxy_pass http://127.0.0.1:1313/;
    }

    # FVK Service -> http://127.0.0.1:8088/
    location = /fvk {
        return 301 /fvk/;
    }
    location /fvk/ {
        proxy_pass http://127.0.0.1:8088/;
    }

    # Service Controller -> http://127.0.0.1:9090/
    location = /controller {
        auth_basic "Midnight L2 Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;
        return 301 /controller/;
    }
    location /controller/ {
        auth_basic "Midnight L2 Dashboard";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:9090/;
        # WebSocket support for /controller/logs
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Metrics API -> http://127.0.0.1:13200/
    location = /metrics {
        return 301 /metrics/;
    }
    location /metrics/ {
        proxy_pass http://127.0.0.1:13200/;
    }
}
