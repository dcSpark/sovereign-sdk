[package]
name = "sov-rollup-ligero"
version = "0.3.0"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = "Sovereign Permissionless Commercial License"
repository = { workspace = true }
publish = false
default-run = "sov-rollup-ligero"

[lints]
workspace = true

[dependencies]
# non-optional dependencies
const-rollup-config = { path = "../const-rollup-config" }
sov-address = { workspace = true, features = ["evm"] }
sov-celestia-adapter = { workspace = true, features = ["native"] }
sov-midnight-da = { workspace = true, features = ["native"] }
sov-rollup-interface = { workspace = true, features = ["native"] }
sov-stf-runner = { workspace = true }
sov-metrics = { workspace = true, features = ["native"] }

# Sovereign crates
sov-bank = { workspace = true, features = ["native"] }
sov-cli = { workspace = true }
sov-db = { workspace = true }
sov-ethereum = { workspace = true, features = ["local"] }
sov-evm = { workspace = true, features = ["native"] }
sov-kernels = { workspace = true, features = ["native"] }
sov-mock-zkvm = { workspace = true, features = ["native"] }
sov-modules-api = { workspace = true, features = ["native"] }
sov-modules-rollup-blueprint = { workspace = true, features = ["native"] }
sov-modules-stf-blueprint = { workspace = true, features = ["native"] }
# Use Ligero instead of RISC0/SP1
sov-ligero-adapter = { workspace = true, features = ["native"] }
sov-sequencer = { workspace = true }
full-node-configs = { workspace = true }
sov-state = { workspace = true, features = ["native"] }

demo-stf = { workspace = true, features = ["native"] }

ligero = { path = "./provers/ligero" }

borsh = { workspace = true, features = ["bytes", "derive"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
axum = { workspace = true, default-features = false, features = ["http1", "tokio"] }
jsonrpsee = { workspace = true, features = [
  "http-client",
  "server",
  "ws-client",
] }
schemars = { workspace = true }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
] }
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
] }
base64 = { workspace = true }
hex = { workspace = true, optional = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "net",
  "process",
  "sync",
  "time",
  "macros",
  "fs",
  "tracing",
] }
tracing = { workspace = true }
prometheus_exporter = "0.8.5"
clap = { workspace = true, features = ["derive"] }
secp256k1 = { workspace = true, features = ["global-context", "recovery"] }
midnight-privacy = { workspace = true, features = ["native"] }
sov-api-spec = { workspace = true }
sov-test-utils = { workspace = true }
sov-proof-verifier-service = { path = "../../crates/utils/sov-proof-verifier-service" }
sov-node-client = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }
num_cpus = "1.16"
rand = { workspace = true }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
bincode = { workspace = true }
toml = { workspace = true }
tiny_http = "0.12"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
# ligero-runner for the prover service binary
ligero-runner = { git = "https://github.com/dcSpark/ligero-prover.git", rev = "da388b5f5e0ac9e9fcc465acc3e10289e23de1fd" }
midnight-onchain-state = { git = "https://github.com/dcSpark/midnight-ledger", branch = "midnight-l2" }
midnight-serialize = { git = "https://github.com/dcSpark/midnight-ledger", branch = "midnight-l2" }
midnight-storage = { git = "https://github.com/dcSpark/midnight-ledger", branch = "midnight-l2" }
base_crypto = { git = "https://github.com/dcSpark/midnight-ledger", branch = "midnight-l2", package = "midnight-base-crypto" }

[dev-dependencies]
sov-eth-client = { workspace = true }
sov-address = { workspace = true, features = ["native", "arbitrary"] }
sov-ligero-adapter = { workspace = true, features = ["native", "arbitrary"] }
sov-celestia-adapter = { workspace = true, features = ["native", "arbitrary"] }
sov-mock-zkvm = { workspace = true, features = ["native", "arbitrary"] }
sov-rollup-interface = { workspace = true, features = ["arbitrary"] }
sov-modules-api = { workspace = true, features = [
  "native",
  "arbitrary",
  "test-utils",
] }
sov-mock-da = { workspace = true, features = ["arbitrary"] }
sov-midnight-da = { workspace = true, features = ["arbitrary"] }
sov-bank = { workspace = true, features = ["native", "arbitrary"] }
sov-sequencer-registry = { workspace = true, features = [
  "native",
  "arbitrary",
] }
sov-accounts = { workspace = true, features = ["native", "arbitrary"] }
sov-api-spec = { workspace = true }
sov-modules-macros = { workspace = true, features = ["arbitrary"] }
sov-test-utils = { workspace = true }
sov-chain-state = { workspace = true }
sov-blob-storage = { workspace = true }
sov-synthetic-load = { workspace = true, features = ["native"] }
reth-primitives = { workspace = true, default-features = false }
futures = "0.3"
tracing-panic = { version = "0.1.2" }
rand = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
borsh = { workspace = true }
sov-universal-wallet = { workspace = true, features = ["serde"] }
sov-modules-api = { workspace = true }
sov-mock-zkvm = { workspace = true, features = ["native"] }
sov-ligero-adapter = { workspace = true, features = ["native"] }
sov-mock-da = { workspace = true, features = ["native"] }
sov-midnight-da = { workspace = true, features = ["native"] }
demo-stf = { workspace = true, features = ["native"] }
sov-address = { workspace = true, features = ["evm"] }
sov-state = { workspace = true, features = ["native"] }
sov-modules-macros = { workspace = true, features = ["arbitrary"] }
sov-zkvm-utils = { workspace = true }
sov-build = { workspace = true }

[features]
default = ["dep:hex"]
arbitrary = [
  "dep:hex",
  "sov-modules-api/arbitrary",
  "sov-rollup-interface/arbitrary",
  "sov-state/arbitrary",
  "sov-address/arbitrary",
  "sov-mock-da/arbitrary",
  "sov-midnight-da/arbitrary",
  "sov-mock-zkvm/arbitrary",
  "sov-celestia-adapter/arbitrary",
  "sov-ligero-adapter/arbitrary",
  "sov-bank/arbitrary",
  "sov-sequencer-registry/arbitrary",
  "sov-accounts/arbitrary",
]

[[bin]]
name = "sov-rollup-ligero"
path = "src/main.rs"

[[bin]]
name = "generate-genesis-keys"
path = "src/bin/generate_genesis_keys.rs"

[[bin]]
name = "generate-authority-fvk"
path = "src/bin/generate_authority_fvk.rs"

[[bin]]
name = "decrypt-authority-notes"
path = "src/bin/decrypt_authority_notes.rs"

[[bin]]
name = "rollup-ligero-service-controller"
path = "src/bin/rollup_ligero_service_controller.rs"

