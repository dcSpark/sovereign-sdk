[package]
name = "tee"
description = "Library that generate and verifies TEE attestations."
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
version = "0.1.0"

[dependencies]
sev = { version = "=7.1.0", optional = true, default-features = false, features = ["snp"] }

[features]
# Microsoft Azure Attestation adapter
maa = []
# Raw SEV adapter.
sev = ["deps/sev"]
# Default features
default = ["maa"]

[lints]
workspace = true
