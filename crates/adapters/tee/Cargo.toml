[package]
name = "tee"
description = "Library that generate and verifies TEE attestations."
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
sev = { version = "=7.1.0", optional = true, default-features = false, features = ["snp"] }
az-snp-vtpm = { optional = true, version = "=0.7.4" }
base64 = { version = "=0.22.1" }
borsh = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { version = "=0.10.9" }
alloy-primitives = { workspace = true, features = ["borsh", "serde"] }
jsonwebtoken = { optional = true, version = "=10.2.0", features = ["aws_lc_rs"] }

[features]
# Microsoft Azure Attestation
maa = ["dep:jsonwebtoken"]
# Azure HCL report
az_hcl = ["dep:az-snp-vtpm"]
# Raw SEV.
sev = ["dep:sev"]
# Default features
default = []

[lints]
workspace = true
