[package]
name = "sov-ligero-adapter"
description = "An adapter allowing Ligero to be used with the Sovereign SDK"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arbitrary = { workspace = true, features = ["derive"], optional = true }
borsh = { workspace = true, features = ["derive"] }
bincode = { workspace = true }
digest = { workspace = true, features = ["alloc"] }
hex = { workspace = true }
proptest = { workspace = true, features = ["alloc", "std"], optional = true }
rand = { workspace = true, optional = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["alloc", "derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sov-rollup-interface = { workspace = true }
# Ligero runner crate (owned by ligero-prover). We use it for `LigeroProofPackage` everywhere,
# and for host execution only under the `native` feature.
ligero-runner = { git = "https://github.com/dcSpark/ligero-prover.git", rev = "cbd3db933044006fea2706727be4b657b8a6b269" }
# Note: sov-metrics doesn't have a ligero-specific feature yet
# sov-metrics = { workspace = true, optional = true }

# Reuse crypto from mock-zkvm for compatibility
sov-mock-zkvm = { workspace = true }

[dev-dependencies]
sov-ligero-adapter = { path = ".", features = ["native", "arbitrary"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
# Ligetron SDK with native field arithmetic for tests
ligetron = { git = "https://github.com/dcSpark/ligero-prover.git", rev = "cbd3db933044006fea2706727be4b657b8a6b269", features = ["native"] }

[build-dependencies]
anyhow = { workspace = true }
sov-zkvm-utils = { workspace = true }

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["native", "arbitrary"]

[features]
default = []
native = [
    "rand",
    "tempfile",
    "sov-rollup-interface/native",
    "sov-mock-zkvm/native",
]
# bench = [
#     "sov-metrics",
#     "sov-ligero-adapter/bench"
# ]
arbitrary = [
    "dep:arbitrary",
    "dep:proptest",
    "sov-rollup-interface/arbitrary",
]
