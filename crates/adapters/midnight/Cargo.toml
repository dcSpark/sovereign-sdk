[package]
name = "sov-midnight-adapter"
description = "Utilities for interacting with Midnight bridge contract state"
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
hex = { workspace = true }
midnight-node-ledger-helpers = { git = "https://github.com/midnightntwrk/midnight-node", rev = "c0e000e5", package = "midnight-node-ledger-helpers", features = ["can-panic"] }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
