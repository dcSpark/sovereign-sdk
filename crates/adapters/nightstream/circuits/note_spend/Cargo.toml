[package]
name = "note-spend"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "note_spend"
path = "src/main.rs"

# Standalone guest project: do not inherit the repo workspace.
[workspace]

[profile.release]
panic = "abort"
opt-level = "s"       # Optimize for code size (smaller ROM)
lto = true            # Link-time optimization for smaller binaries

[dependencies]
nightstream-sdk = { git = "https://github.com/dcSpark/Nightstream", rev = "cca6616a2702091e67e271aca2b8dc21bb4b798b", default-features = false }
