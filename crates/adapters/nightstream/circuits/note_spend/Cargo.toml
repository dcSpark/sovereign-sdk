[package]
name = "note-spend"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "note_spend"
path = "src/main.rs"

# Standalone guest project: do not inherit the repo workspace.
[workspace]

[profile.release]
panic = "abort"
opt-level = "s"       # Optimize for code size (smaller ROM)
lto = true            # Link-time optimization for smaller binaries

[dependencies]
nightstream-sdk = { path = "../../../../../../Nightstream/crates/nightstream-sdk", default-features = false }
