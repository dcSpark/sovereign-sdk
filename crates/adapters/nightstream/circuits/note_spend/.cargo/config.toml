[build]
target = "riscv32im-unknown-none-elf"

[target.riscv32im-unknown-none-elf]
# Link against the vendored linker script.
# Note: Stack/heap sizing is controlled by the host's ram_bytes parameter (64KB default).
# The linker symbols (_STACK_PTR, _NEO_HEAP_START, etc.) define the guest's *view* of
# memory layout but the actual RAM size is set by the host.
rustflags = [
    "-C", "link-arg=-T../riscv32im-unknown-none-elf.ld",
    "-C", "target-feature=-c",
    # Place stack near top of 64KB RAM (host sets ram_bytes = 0x10000)
    "-C", "link-arg=--defsym=_STACK_PTR=0xFE00",
]

[env]
# The parent repo may set RUSTFLAGS (e.g. `-C target-cpu=native`) globally for host builds.
# That breaks cross-compiling this guest, so override it locally.
RUSTFLAGS = ""
