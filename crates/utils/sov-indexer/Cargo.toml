[package]
name = "sov-indexer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["json", "query", "tokio", "http1"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
dotenvy = "0.15"
utoipa = { git = "https://github.com/juhaku/utoipa.git", rev = "a985d8c1340f80ab69b2b0e5de799df98d567732", features = ["axum_extras"] }
utoipa-swagger-ui = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["now"] }
base64 = { workspace = true }
borsh = { workspace = true, features = ["derive"] }
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-json",
] }
# No CLI flags; service reads config from env vars

# DA entities
sov-midnight-da = { package = "sov-midnight-da", path = "../../adapters/midnight-da", default-features = false, features = ["native"] }

# Privacy/viewing support (optional FVK decryption)
midnight-privacy = { path = "../../module-system/module-implementations/midnight-privacy", default-features = false, features = ["native"] }
hex = { workspace = true }
bech32 = { workspace = true }

# Concurrent data structures
dashmap = "6"
reqwest = { workspace = true, features = ["json"] }
