[package]
name = "sov-metrics-api"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["json", "tokio", "http1", "query"] }
dotenvy = "0.15"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
chrono = { workspace = true }
tsink = { path = "../../../tsink" }
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
] }
utoipa = { git = "https://github.com/juhaku/utoipa.git", rev = "a985d8c1340f80ab69b2b0e5de799df98d567732", features = ["axum_extras"] }
utoipa-swagger-ui = { workspace = true }

sov-midnight-da = { package = "sov-midnight-da", path = "../../adapters/midnight-da", default-features = false, features = ["native"] }
