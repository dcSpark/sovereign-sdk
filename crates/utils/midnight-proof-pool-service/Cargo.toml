[package]
name = "midnight-proof-pool-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, default-features = false }
dotenvy = "0.15"
hex.workspace = true
midnight-privacy = { workspace = true, features = ["native"] }
mcp-external = { path = "../../mcp-external" }
rand.workspace = true
reqwest = { workspace = true, features = ["json"] }
rusqlite = { version = "0.32.1" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, default-features = false }
sov-bank = { workspace = true }
sov-modules-api = { workspace = true, features = ["native"] }
sov-nightstream-adapter = { workspace = true }
sov-proof-verifier-service = { path = "../sov-proof-verifier-service" }
sov-rollup-interface = { workspace = true }
sha2 = { workspace = true }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
