[package]
name = "sov-proof-verifier-service"
version = "0.1.0"
edition = "2021"
authors = ["Sovereign Labs <info@sovereign.xyz>"]
license = "MIT OR Apache-2.0"
description = "Off-chain parallel proof verification service for Ligero rollup"

[[bin]]
name = "proof-verifier"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }

# Web framework
axum = { workspace = true, features = ["tokio", "http1", "http2"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_bytes = "0.11"
borsh = { workspace = true }
bincode = { workspace = true }

# Crypto
sha2 = { workspace = true }
ed25519-dalek = { version = "2" }
hex = { workspace = true }

# Temp files (used for daemon-mode Ligero verifier, which expects a proof file path:
# `proof_data.gz` (default) or `proof_data.bin` when gzip is disabled)
tempfile = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# HTTP client
reqwest = { workspace = true, features = ["json"] }

# Base64 encoding
base64 = { workspace = true }

# Database
chrono = { workspace = true }
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }

# Sovereign SDK dependencies
sov-modules-api = { workspace = true, features = ["native"] }
sov-modules-stf-blueprint = { workspace = true, features = ["native"] }
sov-ligero-adapter = { workspace = true, features = ["native"] }
sov-rollup-interface = { workspace = true }
sov-node-client = { workspace = true }
sov-api-spec = { workspace = true }
sov-value-setter = { workspace = true, features = ["native"] }
sov-address = { workspace = true, features = ["native", "evm"] }
sov-midnight-da = { workspace = true, features = ["native"] }
sov-mock-zkvm = { workspace = true, features = ["native"] }
midnight-privacy = { workspace = true, features = ["native"] }
sov-stf-runner = { workspace = true }

# Daemon-mode verifier pool (keeps `webgpu_verifier --daemon` workers warm)
ligero-runner = { git = "https://github.com/dcSpark/ligero-prover.git", rev = "e86c3f7119a07eb51b4408dd6fce10b7ad54c45c" }

# Runtime type for transaction signing
demo-stf = { path = "../../../examples/demo-rollup/stf", features = ["native"] }

# CLI args
clap = { workspace = true, features = ["derive"] }

# Futures utilities
futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
