[package]
name = "sov-proof-verifier-service"
version = "0.1.0"
edition = "2021"
authors = ["Sovereign Labs <info@sovereign.xyz>"]
license = "MIT OR Apache-2.0"
description = "Off-chain parallel proof verification service for Nightstream rollup"

[[bin]]
name = "proof-verifier"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }

# Web framework
axum = { workspace = true, features = ["tokio", "http1", "http2"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "cors"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_bytes = "0.11"
borsh = { workspace = true }
bincode = { workspace = true }

# Crypto
sha2 = { workspace = true }
ed25519-dalek = { version = "2" }
hex = { workspace = true }

tempfile = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# HTTP client
reqwest = { workspace = true, features = ["json"] }
aws-config = { version = "=1.8.13", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.122.0", features = ["rt-tokio", "rustls"] }
aws-credential-types = "=1.2.11"
aws-runtime = "=1.6.0"
aws-sdk-sts = { version = "=1.97.0", default-features = false }
aws-sigv4 = "=1.3.8"
aws-smithy-async = "=1.2.11"
aws-smithy-checksums = "=0.64.3"
aws-smithy-eventstream = "=0.60.18"
aws-smithy-http = "=0.63.3"
aws-smithy-json = "=0.62.3"
aws-smithy-observability = "=0.2.4"
aws-smithy-query = "=0.60.13"
aws-smithy-runtime = "=1.10.0"
aws-smithy-runtime-api = "=1.11.3"
aws-smithy-types = "=1.4.3"
aws-smithy-xml = "=0.60.13"
aws-types = "=1.3.11"

# Base64 encoding
base64 = { workspace = true }

# Database
chrono = { workspace = true }
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }

# Sovereign SDK dependencies
sov-modules-api = { workspace = true, features = ["native"] }
sov-modules-stf-blueprint = { workspace = true, features = ["native"] }
sov-nightstream-adapter = { workspace = true, features = ["native"] }
sov-rollup-interface = { workspace = true }
sov-node-client = { workspace = true }
sov-api-spec = { workspace = true }
sov-value-setter = { workspace = true, features = ["native"] }
sov-address = { workspace = true, features = ["native", "evm"] }
sov-midnight-da = { workspace = true, features = ["native"] }
sov-mock-zkvm = { workspace = true, features = ["native"] }
midnight-privacy = { workspace = true, features = ["native"] }
sov-stf-runner = { workspace = true }

# Nightstream trace simulation helpers (used by /prove pre-simulation).
neo-memory = { git = "https://github.com/LFDT-Nightstream/Nightstream", rev = "5b98cb6471fccea81b86a335c54d6f3a73f5499d" }
neo-vm-trace = { git = "https://github.com/LFDT-Nightstream/Nightstream", rev = "5b98cb6471fccea81b86a335c54d6f3a73f5499d" }


# Runtime type for transaction signing
demo-stf = { path = "../../../examples/demo-rollup/stf", features = ["native"] }

# CLI args
clap = { workspace = true, features = ["derive", "env"] }

# CPU detection for default concurrency
num_cpus = "1.16"

# Futures utilities
futures = { workspace = true }
flate2 = "1.1.9"

[dev-dependencies]
tempfile = { workspace = true }
