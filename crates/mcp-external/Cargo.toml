[package]
name = "mcp-external"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
rmcp = { version = "0.10", features = [
    "server",
    "transport-streamable-http-server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
dotenvy = "0.15"
envy = "0.4"
url = { version = "2", features = ["serde"] }
axum = "0.8"
futures = "0.3"
validator = { version = "0.18", features = ["derive"] }
hex = { workspace = true }
bincode.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
ed25519-dalek = { version = "2" }
uuid = { workspace = true, features = ["v5", "v4", "std"] }
tracing-appender = { workspace = true }
chrono = { workspace = true, features = ["std"] }
aes-gcm = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }

# Sovereign SDK dependencies for wallet integration
sov-cli = { workspace = true }
sov-modules-api = { workspace = true, features = ["native"] }
sov-bank = { workspace = true }
sov-node-client = { workspace = true }
sov-address = { workspace = true }
demo-stf = { workspace = true, features = ["native"] }
sov-mock-da = { workspace = true, features = ["native"] }
sov-mock-zkvm = { workspace = true }
base64.workspace = true
borsh.workspace = true
sov-value-setter-zk.workspace = true
sov-modules-stf-blueprint.workspace = true
midnight-privacy = { workspace = true, features = ["native", "parallel-merkle"] }
rand = { workspace = true }
sov-api-spec = { workspace = true }
sov-nightstream-adapter = { workspace = true, features = ["native"] }
flate2 = "1"

[dev-dependencies]
dirs = "6.0.0"
tokio = { workspace = true, features = ["macros"] }
tracing-test = { workspace = true }

[lints]
workspace = true
