[package]
name = "midnight-privacy"
description = "Midnight Privacy Module"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

version = { workspace = true }
readme = "README.md"
publish = false

[lints]
workspace = true

[dev-dependencies]
sov-address = { workspace = true }
tempfile = { workspace = true }
sov-modules-api = { workspace = true, features = ["native"] }
sov-test-utils = { workspace = true }
sov-state = { workspace = true, features = ["native"] }
sha2 = { workspace = true }
sov-rollup-interface = { workspace = true, features = ["native"] }
hex = { workspace = true }
serde_json = { workspace = true }
sov-bank = { workspace = true, features = ["native", "test-utils"] }
sov-kernels = { workspace = true }
sov-mock-da = { workspace = true }

[dependencies]
anyhow = { workspace = true }
sov-modules-api = { workspace = true }
sov-rollup-interface = { workspace = true }
sov-nightstream-adapter = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
borsh = { workspace = true, features = ["rc"] }
sov-state = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
bech32 = { workspace = true }
x25519-dalek = { version = "2", features = ["static_secrets"] }
neo-ccs = { git = "https://github.com/LFDT-Nightstream/Nightstream", rev = "a2b0b8a87f6d555217535545476ef09ede805dac" }
p3-goldilocks = "0.4.1"
p3-field = "0.4.1"
sov-bank = { workspace = true }
once_cell = { workspace = true }
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
sha2 = { workspace = true }
tracing = { workspace = true }
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "postgres-array",
    "with-chrono",
] }
sov-midnight-da = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rayon = { workspace = true, optional = true }

[features]
default = ["native"]
parallel-merkle = ["dep:rayon"]
native = [
    "sov-modules-api/native",
    "sov-rollup-interface/native",
    "sov-state/native",
    "sov-address/native",
    "sov-nightstream-adapter/native",
    "sov-midnight-da/native"
]
