[package]
name = "midnight-privacy"
description = "Midnight Privacy Module"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

version = { workspace = true }
readme = "README.md"
publish = false

[lints]
workspace = true

[dev-dependencies]
sov-address = { workspace = true }
tempfile = { workspace = true }
sov-modules-api = { workspace = true, features = ["native"] }
sov-test-utils = { workspace = true }
sov-state = { workspace = true, features = ["native"] }
sha2 = { workspace = true }
sov-ligero-adapter = { workspace = true, features = ["native"] }
sov-rollup-interface = { workspace = true, features = ["native"] }
hex = { workspace = true }
serde_json = { workspace = true }
sov-bank = { workspace = true, features = ["native", "test-utils"] }
sov-kernels = { workspace = true }
sov-mock-da = { workspace = true }
ligero-runner = { git = "https://github.com/dcSpark/ligero-prover.git", rev = "7b6ac4849035fef8f108e7cadce2a601e63e5200" }

[dependencies]
anyhow = { workspace = true }
sov-modules-api = { workspace = true }
sov-rollup-interface = { workspace = true }
sov-ligero-adapter = { workspace = true }
sov-nightstream-adapter = { workspace = true, optional = true }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
borsh = { workspace = true, features = ["rc"] }
sov-state = { workspace = true }
bincode = { workspace = true }
hex = { workspace = true }
bech32 = { workspace = true }
# Ligetron SDK with native field arithmetic (same Poseidon2 as circuit!)
ligetron = { git = "https://github.com/dcSpark/ligero-prover.git", rev = "7b6ac4849035fef8f108e7cadce2a601e63e5200", features = ["native"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
sov-bank = { workspace = true }
once_cell = { workspace = true }
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = "0.12"
sha2 = { workspace = true }
tracing = { workspace = true }
sea-orm = { version = "1.1", default-features = false, features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "postgres-array",
    "with-chrono",
] }
sov-midnight-da = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rayon = { workspace = true, optional = true }

[features]
default = ["native"]
parallel-merkle = ["dep:rayon"]
nightstream = ["sov-nightstream-adapter"]
native = [
    "sov-modules-api/native",
    "sov-rollup-interface/native",
    "sov-state/native",
    "sov-address/native",
    "sov-ligero-adapter/native",
    "sov-nightstream-adapter?/native",
    "sov-midnight-da/native"
]
