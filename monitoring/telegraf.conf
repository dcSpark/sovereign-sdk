 # Listen for sov_metrics (Influx line protocol) on UDP 8094
  [[inputs.socket_listener]]
    service_address = "udp://:8094"
    data_format = "influx"

  # Basic stats (count/mean/min/max/median/stdev) over 10s windows
  [[aggregators.basicstats]]
    namepass = ["sov_rollup_*"]
    period = "10s"
    grace = "5s"
    drop_original = false
    stats = ["count","mean","min","max","median","stdev"]

  # Create histogram buckets for parallel tx stage metrics
  # Buckets optimized for the 3 stages:
  # Stage 1: 0-1ms (0-1000us)
  # Stage 2: 1-10000ms (1000-10000000us)
  # Stage 3: 0-10ms (0-10000us)
  [[aggregators.histogram]]
    namepass = ["sov_sequencer_parallel_tx_stage"]
    period = "10s"
    drop_original = false
    reset = false
    cumulative = true

  # Expose everything as Prometheus-format on :9273
  [[outputs.prometheus_client]]
    listen = ":9273"
    path = "/metrics"
    expiration_interval = "60s"
    # Export histograms as Prometheus native histograms
    export_timestamp = true
